<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Health Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1419;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 600;
        }
        
        .timestamp {
            font-size: 12px;
            color: #888;
            font-family: 'Monaco', 'Menlo', monospace;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
        }
        
        .status-healthy {
            background: #1b4332;
            color: #52b788;
        }
        
        .status-degraded {
            background: #664d03;
            color: #ffc300;
        }
        
        .status-critical {
            background: #5a1e1e;
            color: #ff6b6b;
        }
        
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #1a1f26;
            border: 1px solid #2a3038;
            border-radius: 8px;
            padding: 15px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            font-family: 'Monaco', 'Menlo', monospace;
        }
        
        .critical-services {
            background: #1a1f26;
            border: 1px solid #2a3038;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .critical-services h2 {
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .service-list {
            display: grid;
            gap: 10px;
        }
        
        .service-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #0f1419;
            border-radius: 4px;
        }
        
        .service-icon {
            font-size: 18px;
            min-width: 20px;
        }
        
        .service-name {
            font-weight: 500;
            flex: 1;
        }
        
        .service-status {
            font-size: 12px;
            color: #888;
            font-family: 'Monaco', 'Menlo', monospace;
        }
        
        .services-section {
            background: #1a1f26;
            border: 1px solid #2a3038;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .services-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .service-group {
            margin-bottom: 20px;
        }
        
        .service-group-title {
            font-size: 12px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .service-group-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        
        .service-item-small {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: #0f1419;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .service-item-small .icon {
            font-size: 14px;
            min-width: 14px;
        }
        
        .refresh-button {
            padding: 8px 16px;
            background: #1b4332;
            color: #52b788;
            border: 1px solid #2d6a4f;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .refresh-button:hover {
            background: #2d6a4f;
        }
        
        .hal-section {
            background: #1a1f26;
            border: 1px solid #2a3038;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .hal-status {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .hal-status-icon {
            font-size: 32px;
        }
        
        .hal-status-info h2 {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .hal-status-detail {
            font-size: 12px;
            color: #888;
            font-family: 'Monaco', 'Menlo', monospace;
        }
        
        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #333;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎩 OpenClaw Health Dashboard</h1>
            <div>
                <button class="refresh-button" onclick="refresh()">↻ Refresh</button>
            </div>
        </header>
        
        <div id="content">
            <p style="text-align: center; color: #666;">Loading health status...</p>
        </div>
        
        <footer>
            <p>Health Dashboard • Real-time monitoring of OpenClaw infrastructure</p>
            <p id="footer-note"></p>
        </footer>
    </div>
    
    <script>
        const HEALTH_DIR = '/.openclaw/workspace/health';
        
        async function loadSnapshot() {
            try {
                // Try to fetch latest snapshot
                // In a real implementation, this would be served by the API
                const response = await fetch(`${HEALTH_DIR}/latest-snapshot.json`);
                if (!response.ok) throw new Error('Failed to load snapshot');
                return await response.json();
            } catch (err) {
                console.error('Error loading snapshot:', err);
                return null;
            }
        }
        
        function renderSnapshot(snapshot) {
            if (!snapshot) {
                document.getElementById('content').innerHTML = '<p style="text-align: center; color: #f00;">Failed to load health status</p>';
                return;
            }
            
            const { agents, hal, gateway, resources, summary } = snapshot;
            const timestamp = new Date(snapshot.timestamp).toLocaleString('en-US', {
                timeZone: 'America/Moncton',
                month: 'short',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true,
            });
            
            // Status badge
            const statusClass = summary.healthScore === 'HEALTHY' ? 'status-healthy' 
                              : summary.healthScore === 'DEGRADED' ? 'status-degraded' 
                              : 'status-critical';
            
            // Build HTML
            let html = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div>
                    <span class="status-badge ${statusClass}">${summary.healthScore}</span>
                </div>
                <div class="timestamp">${timestamp} AST</div>
            </div>
            
            <div class="summary">
                <div class="stat-card">
                    <div class="stat-label">Agents Running</div>
                    <div class="stat-value">${summary.running}/${summary.totalAgents}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Services Down</div>
                    <div class="stat-value">${summary.down}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Critical Down</div>
                    <div class="stat-value" style="color: ${summary.criticalDown > 0 ? '#ff6b6b' : '#52b788'};">${summary.criticalDown}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">HAL Gateway</div>
                    <div class="stat-value" style="color: ${hal.status === 'online' ? '#52b788' : '#ff6b6b'};">${hal.status}</div>
                </div>
            </div>
            
            <div class="critical-services">
                <h2>🚨 Critical Services</h2>
                <div class="service-list">
            `;
            
            for (const [name, status] of Object.entries(agents)) {
                if (!status.critical) continue;
                const icon = status.status === 'running' ? '✅' : '❌';
                const shortName = name.split('.').pop();
                html += `
                <div class="service-item">
                    <span class="service-icon">${icon}</span>
                    <span class="service-name">${shortName}</span>
                    <span class="service-status">${status.status}</span>
                </div>
                `;
            }
            
            html += `
                </div>
            </div>
            `;
            
            // HAL Gateway
            html += `
            <div class="hal-section">
                <h2>🖥️ HAL Gateway</h2>
                <div class="hal-status">
                    <div class="hal-status-icon">${hal.status === 'online' ? '✅' : '❌'}</div>
                    <div class="hal-status-info">
                        <h2>${hal.status.toUpperCase()}</h2>
                        <div class="hal-status-detail">
                            Address: 192.168.2.79:18789<br>
                            ${hal.latency ? `Latency: ${hal.latency}ms` : hal.error ? `Error: ${hal.error}` : ''}
                        </div>
                    </div>
                </div>
            </div>
            `;
            
            // Group services by status
            const byStatus = {};
            for (const [name, status] of Object.entries(agents)) {
                if (!byStatus[status.status]) byStatus[status.status] = [];
                byStatus[status.status].push(name);
            }
            
            // Running services
            if (byStatus.running && byStatus.running.length > 0) {
                html += `
                <div class="services-section">
                    <h2>✅ Running Services (${byStatus.running.length})</h2>
                    <div class="service-group-list">
                `;
                for (const name of byStatus.running) {
                    const shortName = name.split('.').pop();
                    const pid = agents[name].pid ? ` [${agents[name].pid}]` : '';
                    html += `<div class="service-item-small"><span class="icon">✅</span> ${shortName}${pid}</div>`;
                }
                html += `</div></div>`;
            }
            
            // Disabled services
            if (byStatus.disabled && byStatus.disabled.length > 0) {
                html += `
                <div class="services-section">
                    <h2>⏸️ Disabled Services (${byStatus.disabled.length})</h2>
                    <div class="service-group-list">
                `;
                for (const name of byStatus.disabled) {
                    const shortName = name.split('.').pop();
                    html += `<div class="service-item-small"><span class="icon">⏸</span> ${shortName}</div>`;
                }
                html += `</div></div>`;
            }
            
            // System Resources
            html += `
            <div class="services-section">
                <h2>💾 System Resources</h2>
                <div style="font-family: 'Monaco', 'Menlo', monospace; font-size: 13px;">
                    <div>Memory: ${resources.memory}</div>
                    <div>Disk: ${resources.disk}</div>
                    <div>Gateway uptime: ${gateway}</div>
                </div>
            </div>
            `;
            
            document.getElementById('content').innerHTML = html;
            document.getElementById('footer-note').textContent = `Last updated: ${timestamp} AST`;
        }
        
        async function refresh() {
            const snapshot = await loadSnapshot();
            renderSnapshot(snapshot);
        }
        
        // Initial load
        refresh();
        
        // Auto-refresh every 30 seconds
        setInterval(refresh, 30000);
    </script>
</body>
</html>
